<html>
<head>
    <title>Registration Form</title>
    <style>
        .form{
            width: 100%;
            display: flex;
            justify-content: center;

        }
        .form table{
            border: 1px solid black;
            background-color: lightblue;
        }
        .body{
            background-color: lightcyan;
        }
    </style>
</head>

<body class="body">
    <h1 style=text-align:center>Registration form for workshop on Web Development</h1>
</body>
<form class="form">
    <table>
        <tr>
            <td>
                First Name
            </td>
            <td>
                <input type="text" placeholder="Ajit">
            </td>
        </tr>
        <tr>
        <td>
            Middle Name
        </td>
        <td>
            <input type="text" placeholder="Kumar">
        </td>
        </tr>
        <tr>
            <td>
                Last Name
            </td>
            <td>
                <input type="text" placeholder="Sinha">
            </td>
        </tr>
        <tr>
            <td>
                Email Id
            </td>
            <td>
                <input type="text" placeholder="example1@gmail.com">
            </td>
        </tr>
        <tr>
            <td>
                Date of Birth
            </td>
            <td>
                <input type="date">
            </td>
        </tr>
        <tr>
            <td>
                Contact Number
            </td>
            <td>
                <input type="phone" placeholder="9852******">
            </td>
        </tr>
        <tr>
            <td>
                Gender
            </td>
            <td>
                <input type="radio" value="Male">Male
            </td>
            <td>
                <input type="radio" name="gender" value="Female">Female
            </td>
        </tr>
        <tr>
            <td>
                Course
            </td>
            <td>
                <input type="radio" name="course" value="bca">BCA
            </td>
            <td>
                <input type="radio" name="course" value="mca">MCA
            </td>
            <td>
                <input type="radio" name="course" value="btech">BTECH
            </td>
            <td>
                <input type="radio" name="course" value="mtech">MTECH
            </td>
        </tr>
        <tr>
            <td>
                Languages Known
            </td>
            <td>
                <input type="checkbox" value="a">HTML
            </td>
            <td>
                <input type="checkbox" value="b">CSS
            </td>
            <td>
                <input type="checkbox" value="b">JavaScript
            </td>
            <td>
                <input type="checkbox" value="c">Bootstrap
            </td>
        </tr>
        <tr>
            <td>
                Set Password
            </td>
            <td>
                <input type="password" placeholder="Aj453@7e">
            </td>
        </tr>
        <tr>
            <td>
                <input type="submit" value="Reset">
            </td>
            <td>
                <input type="submit" value="Submit">
            </td>
        </tr>
    </table>
</form>

</html>

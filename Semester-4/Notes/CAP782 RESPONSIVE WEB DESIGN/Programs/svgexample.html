<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>funny face</title>
    <style>
        svg{
            background-color:bisque;
        }
    </style>
</head>
<body>
    <svg width="400" height="400">
        <ellipse cx="100" cy="50" rx="20" ry="50" stroke-width="5" fill="green" stroke="blue"></ellipse>
        <ellipse cx="300" cy="50" rx="20" ry="50" stroke-width="5" fill="green" stroke="blue"></ellipse>
        <rect x="50" y="50" height="300" width="300" fill="green" stroke="green"></rect>
        <circle cx="100" cy="30" r="10" fill="red"></circle>
        <circle cx="300" cy="30" r="10" fill="red"></circle>
        <circle cx="120" cy="150" r="40" fill="red" stroke="red"></circle>
        <circle cx="280" cy="150" r="40" fill="red" stroke="red"></circle>
        <rect x="150" y="250" width="100" height="50" fill="blue" stroke="blue"></rect>
        <polyline points="170 230, 230 230, 200 180" fill="yellowgreen"></polyline>
        <text x="100" y="380" fill="red" style="font-weight: bolder;font-size:larger">Funny Face</text>
    </svg>
</body>
</html>
